<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Karaoke Master Pro - Natural Vocal Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: #0f172a; color: #f8fafc; padding: 14px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .card { background: #1e293b; border-radius: 14px; padding: 18px; width: 100%; max-width: 480px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); margin-bottom: 16px; }
    h1 { font-size: 20px; text-align: center; color: #38bdf8; margin-bottom: 14px; }
    
    .file-input-wrapper { margin-bottom: 14px; text-align: center; }
    input[type="file"] { display: none; }
    .file-label { display: block; background: #334155; color: #f8fafc; padding: 14px 16px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; border: 1px solid #475569; width: 100%; text-align: center; }
    
    .toggle-row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px 14px; border-radius: 8px; margin-bottom: 14px; border: 1px solid #334155; }
    .toggle-label { font-size: 14px; color: #cbd5e1; font-weight: 500; }
    .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-toggle { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .3s; border-radius: 28px; }
    .slider-toggle:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider-toggle { background-color: #10b981; }
    input:checked + .slider-toggle:before { transform: translateX(22px); }

    .control-group { margin-bottom: 14px; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
    .control-group label { display: flex; justify-content: space-between; font-size: 14px; color: #94a3b8; margin-bottom: 8px; font-weight: 500; }
    input[type="range"] { width: 100%; height: 26px; accent-color: #38bdf8; cursor: pointer; }
    
    .btn-step-row { display: flex; gap: 8px; align-items: center; }
    .btn-step { background: #334155; color: #f8fafc; border: 1px solid #475569; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; flex: 1; text-align: center; }
    .btn-step:active { background: #475569; }
    .val-display { min-width: 90px; text-align: center; font-size: 16px; font-weight: bold; color: #38bdf8; }

    .mic-meter-box { margin-bottom: 14px; background: #0f172a; border-radius: 6px; padding: 8px; border: 1px solid #334155; }
    .meter-bar-bg { width: 100%; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; }
    .meter-bar-fill { height: 100%; width: 0%; background: #10b981; }

    .timer { text-align: center; font-size: 28px; font-weight: bold; color: #f43f5e; margin: 10px 0; font-variant-numeric: tabular-nums; }
    
    .btn-row { display: flex; gap: 8px; margin-top: 12px; }
    .btn { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
    .btn-rec { background: #e11d48; color: #fff; }
    .btn-stop { background: #64748b; color: #fff; }
    .btn-mix { background: #0284c7; color: #fff; width: 100%; margin-top: 10px; }
    .btn-action { background: #10b981; color: #fff; }
    .btn-preview { background: #8b5cf6; color: #fff; width: 100%; margin-bottom: 14px; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .status-text { text-align: center; font-size: 13px; color: #cbd5e1; margin-top: 8px; min-height: 22px; line-height: 1.4; }
    .preview-box { margin-top: 14px; padding-top: 14px; border-top: 1px dashed #334155; display: none; }
    audio { width: 100%; margin-top: 10px; border-radius: 8px; }
    
    .tip-box { background: #0f172a; padding: 10px 12px; border-radius: 6px; font-size: 12px; color: #94a3b8; margin-top: 12px; border-left: 3px solid #38bdf8; }
  </style>
</head>
<body>

  <main class="card">
    <h1>Studio Karaoke Master Pro</h1>
    
    <!-- 1. Track File Input -->
    <div class="file-input-wrapper">
      <input type="file" id="karaokeFile" accept="audio/*">
      <label for="karaokeFile" class="file-label" id="fileBtnText">Select Karaoke Track (MP3/WAV)</label>
    </div>

    <!-- Earphones / Speaker Mode Toggle -->
    <div class="toggle-row">
      <span class="toggle-label" id="modeStatusText">Mode: Mobile Speaker (Anti-Bleed)</span>
      <label class="switch">
        <input type="checkbox" id="earphoneToggle" aria-label="Toggle Earphone Mode">
        <span class="slider-toggle"></span>
      </label>
    </div>

    <!-- Track Scale (Pitch Shift) Slider (-6 to +6 Semitones) -->
    <div class="control-group">
      <label for="pitchSemi">
        <span>Track Scale (Pitch Shift):</span>
        <span id="pitchVal" aria-live="polite">Original (0 st)</span>
      </label>
      <input type="range" id="pitchSemi" min="-6" max="6" step="1" value="0" aria-label="Track pitch shift from minus 6 to plus 6 semitones">
    </div>

    <!-- Scale Preview Button -->
    <button class="btn btn-preview" id="previewScaleBtn" disabled aria-label="Test scale and play track">Test Scale (Play Track)</button>

    <!-- Live Mic Activity Indicator (Hidden from TalkBack) -->
    <div class="mic-meter-box" aria-hidden="true">
      <div class="meter-bar-bg">
        <div class="meter-bar-fill" id="meterFill"></div>
      </div>
    </div>

    <!-- Vocal Volume with -50% and +50% Buttons (Step: 50%) -->
    <div class="control-group">
      <label>
        <span>Vocal Volume:</span>
        <span id="vocalVolVal" aria-live="polite">100%</span>
      </label>
      <div class="btn-step-row">
        <button class="btn-step" id="btnVocalDown" aria-label="Decrease vocal volume by 50 percent">-50% Volume</button>
        <div class="val-display" id="vocalNumDisplay">100%</div>
        <button class="btn-step" id="btnVocalUp" aria-label="Increase vocal volume by 50 percent">+50% Volume</button>
      </div>
    </div>

    <!-- Karaoke Music Volume Slider -->
    <div class="control-group">
      <label for="musicVol">
        <span>Karaoke Music Volume:</span>
        <span id="musicVolVal" aria-live="polite">70%</span>
      </label>
      <input type="range" id="musicVol" min="10" max="100" step="5" value="70" aria-label="Karaoke music volume from 10 to 100 percent">
    </div>

    <!-- 3. Concert Hall Reverb / Echo Slider (Clean Default: 6%) -->
    <div class="control-group">
      <label for="echoRange">
        <span>Concert Hall Reverb:</span>
        <span id="echoVal" aria-live="polite">6%</span>
      </label>
      <input type="range" id="echoRange" min="0" max="40" step="2" value="6" aria-label="Concert hall reverb from 0 to 40 percent">
    </div>

    <!-- 4. Rhythm Sync / Vocal Offset (0 to 10,000 ms with Fine-tune Buttons) -->
    <div class="control-group">
      <label>
        <span>Rhythm Sync (Vocal Offset):</span>
        <span id="offsetVal" aria-live="polite">220 ms</span>
      </label>
      <div class="btn-step-row">
        <button class="btn-step" id="btnOffsetDown100" aria-label="Decrease offset by 100 milliseconds">-100</button>
        <button class="btn-step" id="btnOffsetDown10" aria-label="Decrease offset by 10 milliseconds">-10</button>
        <div class="val-display" id="offsetNumDisplay">220 ms</div>
        <button class="btn-step" id="btnOffsetUp10" aria-label="Increase offset by 10 milliseconds">+10</button>
        <button class="btn-step" id="btnOffsetUp100" aria-label="Increase offset by 100 milliseconds">+100</button>
      </div>
    </div>

    <div class="timer" id="timeDisp" aria-label="Recording time">00:00</div>
    <div class="status-text" id="statusText" aria-live="polite">Select a track file to begin</div>

    <!-- Main Action Buttons -->
    <div class="btn-row">
      <button class="btn btn-rec" id="startBtn" disabled aria-label="Start Recording">Start Recording</button>
      <button class="btn btn-stop" id="stopBtn" disabled aria-label="Stop Recording or Playback">Stop</button>
    </div>

    <div class="tip-box">
      Tip: Pure Natural Vocal Engine active. No robotic effects or phase distortions.
    </div>

    <!-- Mixing Section -->
    <section class="preview-box" id="mixSection" aria-label="Mixing and Export Controls">
      <button class="btn btn-mix" id="mixBtn" aria-label="Mix Backing Track and Recorded Vocals">Mix Track & Vocals</button>
      
      <div id="readySection" style="display:none; margin-top:12px;">
        <audio id="finalAudioPlayer" controls aria-label="Mixed Song Player"></audio>
        <div class="btn-row" style="margin-top:10px;">
          <button class="btn btn-action" id="downloadBtn" aria-label="Download MP3 Song">Download MP3 Song</button>
          <button class="btn btn-action" id="shareBtn" style="background:#8b5cf6;" aria-label="Share MP3 Audio">Share Audio</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    let sharedAudioCtx = null;
    let micStream = null;
    let mediaRecorder = null;
    let vocalChunks = [];
    
    let liveMusicSource = null;
    let previewSource = null;
    let isPreviewing = false;
    let karaokeBuffer = null;
    let rawVocalBlob = null;
    let finalMp3Blob = null;

    let timerInterval = null;
    let secondsElapsed = 0;
    let meterAnimId = null;

    // State Variables
    let currentPitch = 0;        // -6 to +6
    let currentVocalVol = 100;   // 50% to 350%
    let currentMusicVol = 70;    // 10% to 100%
    let currentOffset = 220;     // 0 to 10,000 ms

    const fileInput = document.getElementById('karaokeFile');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const mixBtn = document.getElementById('mixBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const shareBtn = document.getElementById('shareBtn');
    const previewScaleBtn = document.getElementById('previewScaleBtn');
    const earphoneToggle = document.getElementById('earphoneToggle');
    const modeStatusText = document.getElementById('modeStatusText');
    
    const timeDisp = document.getElementById('timeDisp');
    const statusText = document.getElementById('statusText');
    const mixSection = document.getElementById('mixSection');
    const readySection = document.getElementById('readySection');
    const finalAudioPlayer = document.getElementById('finalAudioPlayer');
    const meterFill = document.getElementById('meterFill');

    // UI Display Elements
    const pitchSemi = document.getElementById('pitchSemi');
    const pitchVal = document.getElementById('pitchVal');
    const echoRange = document.getElementById('echoRange');
    const echoVal = document.getElementById('echoVal');
    const musicVol = document.getElementById('musicVol');
    const musicVolVal = document.getElementById('musicVolVal');
    const vocalVolVal = document.getElementById('vocalVolVal');
    const vocalNumDisplay = document.getElementById('vocalNumDisplay');
    const offsetVal = document.getElementById('offsetVal');
    const offsetNumDisplay = document.getElementById('offsetNumDisplay');

    pitchSemi.oninput = () => {
      currentPitch = parseInt(pitchSemi.value);
      const text = currentPitch === 0 ? "Original (0 st)" : (currentPitch > 0 ? "+" + currentPitch + " st (High)" : currentPitch + " st (Low)");
      pitchVal.innerText = text;
      if (previewSource && isPreviewing) {
        previewSource.detune.value = currentPitch * 100;
      }
    };

    function updateVocalVol(val) {
      currentVocalVol = Math.max(50, Math.min(350, val));
      vocalVolVal.innerText = currentVocalVol + "%";
      vocalNumDisplay.innerText = currentVocalVol + "%";
    }
    document.getElementById('btnVocalDown').onclick = () => updateVocalVol(currentVocalVol - 50);
    document.getElementById('btnVocalUp').onclick = () => updateVocalVol(currentVocalVol + 50);

    musicVol.oninput = () => {
      currentMusicVol = parseInt(musicVol.value);
      musicVolVal.innerText = currentMusicVol + "%";
      if (previewSource && previewSource.gainNode) {
        previewSource.gainNode.gain.value = currentMusicVol / 100;
      }
    };

    echoRange.oninput = () => {
      echoVal.innerText = echoRange.value + '%';
    };

    function updateOffset(val) {
      currentOffset = Math.max(0, Math.min(10000, val));
      offsetVal.innerText = currentOffset + " ms";
      offsetNumDisplay.innerText = currentOffset + " ms";
    }
    document.getElementById('btnOffsetDown100').onclick = () => updateOffset(currentOffset - 100);
    document.getElementById('btnOffsetDown10').onclick = () => updateOffset(currentOffset - 10);
    document.getElementById('btnOffsetUp10').onclick = () => updateOffset(currentOffset + 10);
    document.getElementById('btnOffsetUp100').onclick = () => updateOffset(currentOffset + 100);

    earphoneToggle.addEventListener('change', () => {
      if (earphoneToggle.checked) {
        modeStatusText.innerText = "Mode: Wired Earphones (Pure Studio)";
        modeStatusText.style.color = "#34d399";
      } else {
        modeStatusText.innerText = "Mode: Mobile Speaker (Anti-Bleed)";
        modeStatusText.style.color = "#cbd5e1";
      }
    });

    function getAudioContext() {
      if (!sharedAudioCtx) {
        sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return sharedAudioCtx;
    }

    function stopScalePreview() {
      if (previewSource) {
        try { previewSource.stop(); } catch(e){}
        previewSource = null;
      }
      isPreviewing = false;
      previewScaleBtn.innerText = "Test Scale (Play Track)";
    }

    previewScaleBtn.addEventListener('click', async () => {
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') await ctx.resume();

      if (isPreviewing) {
        stopScalePreview();
        statusText.innerText = "Scale test stopped.";
        return;
      }

      if (!karaokeBuffer) return;

      previewSource = ctx.createBufferSource();
      previewSource.buffer = karaokeBuffer;
      previewSource.detune.value = currentPitch * 100;

      const previewGain = ctx.createGain();
      previewGain.gain.value = currentMusicVol / 100;
      previewSource.gainNode = previewGain;

      previewSource.connect(previewGain);
      previewGain.connect(ctx.destination);

      previewSource.onended = () => stopScalePreview();

      previewSource.start(0);
      isPreviewing = true;
      previewScaleBtn.innerText = "Stop Scale Test";
      statusText.innerText = "Playing scale test... Rehearse your vocals.";
    });

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      stopScalePreview();
      document.getElementById('fileBtnText').innerText = "Selected: " + file.name.substring(0, 20) + "...";
      statusText.innerText = "Decoding audio track...";

      try {
        const arrayBuffer = await file.arrayBuffer();
        const ctx = getAudioContext();
        karaokeBuffer = await ctx.decodeAudioData(arrayBuffer);
        startBtn.disabled = false;
        previewScaleBtn.disabled = false;
        statusText.innerText = "Track ready! Tap 'Test Scale' to rehearse or 'Start Recording'.";
      } catch (err) {
        statusText.innerText = "Error loading audio: " + err.message;
      }
    });

    // Recording Engine
    startBtn.addEventListener('click', async () => {
      stop
