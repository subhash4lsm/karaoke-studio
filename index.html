<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Karaoke Master Pro - Concert Hall Edition</title>
  <!-- Fast and Reliable MP3 Encoder CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.all.min.js" defer></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: #0f172a; color: #f8fafc; padding: 14px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .card { background: #1e293b; border-radius: 14px; padding: 18px; width: 100%; max-width: 480px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); margin-bottom: 16px; }
    h1 { font-size: 20px; text-align: center; color: #38bdf8; margin-bottom: 14px; }
    
    .file-input-wrapper { margin-bottom: 14px; }
    .file-label { display: block; font-size: 14px; color: #38bdf8; font-weight: bold; margin-bottom: 6px; }
    .file-input-field { width: 100%; padding: 12px; background: #334155; color: #f8fafc; border: 2px solid #38bdf8; border-radius: 8px; font-size: 15px; cursor: pointer; }
    
    .toggle-row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px 14px; border-radius: 8px; margin-bottom: 14px; border: 1px solid #334155; }
    .toggle-label { font-size: 14px; color: #cbd5e1; font-weight: 500; }
    .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-toggle { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .3s; border-radius: 28px; }
    .slider-toggle:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider-toggle { background-color: #10b981; }
    input:checked + .slider-toggle:before { transform: translateX(22px); }

    .control-group { margin-bottom: 14px; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
    .control-group label { display: flex; justify-content: space-between; font-size: 14px; color: #94a3b8; margin-bottom: 8px; font-weight: 500; }
    input[type="range"] { width: 100%; height: 26px; accent-color: #38bdf8; cursor: pointer; }
    
    .btn-step-row { display: flex; gap: 8px; align-items: center; }
    .btn-step { background: #334155; color: #f8fafc; border: 1px solid #475569; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; flex: 1; text-align: center; }
    .btn-step:active { background: #475569; }
    .val-display { min-width: 90px; text-align: center; font-size: 16px; font-weight: bold; color: #38bdf8; }

    .mic-meter-box { margin-bottom: 14px; background: #0f172a; border-radius: 6px; padding: 8px; border: 1px solid #334155; }
    .meter-bar-bg { width: 100%; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; }
    .meter-bar-fill { height: 100%; width: 0%; background: #10b981; }

    .timer { text-align: center; font-size: 28px; font-weight: bold; color: #f43f5e; margin: 10px 0; font-variant-numeric: tabular-nums; }
    
    .btn-row { display: flex; gap: 8px; margin-top: 12px; }
    .btn { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
    .btn-rec { background: #e11d48; color: #fff; }
    .btn-stop { background: #64748b; color: #fff; }
    .btn-mix { background: #0284c7; color: #fff; width: 100%; margin-top: 10px; }
    .btn-action { background: #10b981; color: #fff; }
    .btn-preview { background: #8b5cf6; color: #fff; width: 100%; margin-bottom: 14px; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .status-text { text-align: center; font-size: 14px; color: #38bdf8; margin-top: 8px; min-height: 22px; line-height: 1.4; font-weight: 500; }
    .preview-box { margin-top: 14px; padding-top: 14px; border-top: 1px dashed #334155; display: none; }
    audio { width: 100%; margin-top: 10px; border-radius: 8px; }
    
    .tip-box { background: #0f172a; padding: 10px 12px; border-radius: 6px; font-size: 12px; color: #94a3b8; margin-top: 12px; border-left: 3px solid #38bdf8; }
  </style>
</head>
<body>

  <main class="card">
    <h1>Studio Karaoke Master Pro</h1>
    
    <!-- 1. Track File Input -->
    <div class="file-input-wrapper">
      <label for="karaokeFile" class="file-label">Select Karaoke Track (MP3/WAV):</label>
      <input type="file" id="karaokeFile" class="file-input-field" aria-label="Choose Karaoke Track File">
    </div>

    <!-- Hidden Track Player -->
    <audio id="karaokeAudioPlayer" preload="auto" style="display:none;"></audio>

    <!-- Earphones / Speaker Mode Toggle -->
    <div class="toggle-row">
      <span class="toggle-label" id="modeStatusText">Mode: Mobile Speaker (Anti-Bleed)</span>
      <label class="switch">
        <input type="checkbox" id="earphoneToggle" aria-label="Toggle Earphone Mode">
        <span class="slider-toggle"></span>
      </label>
    </div>

    <!-- Track Scale (Pitch Shift) Slider (-6 to +6 Semitones) -->
    <div class="control-group">
      <label for="pitchSemi">
        <span>Track Scale (Pitch Shift):</span>
        <span id="pitchVal" aria-live="polite">Original (0 st)</span>
      </label>
      <input type="range" id="pitchSemi" min="-6" max="6" step="1" value="0" aria-label="Track pitch shift from minus 6 to plus 6 semitones">
    </div>

    <!-- Scale Preview Button -->
    <button class="btn btn-preview" id="previewScaleBtn" disabled aria-label="Test scale and play track">Test Scale (Play Track)</button>

    <!-- Live Mic Activity Indicator -->
    <div class="mic-meter-box" aria-hidden="true">
      <div class="meter-bar-bg">
        <div class="meter-bar-fill" id="meterFill"></div>
      </div>
    </div>

    <!-- Vocal Volume with -50% and +50% Buttons -->
    <div class="control-group">
      <label>
        <span>Vocal Volume:</span>
        <span id="vocalVolVal" aria-live="polite">100%</span>
      </label>
      <div class="btn-step-row">
        <button class="btn-step" id="btnVocalDown" aria-label="Decrease vocal volume by 50 percent">-50% Volume</button>
        <div class="val-display" id="vocalNumDisplay">100%</div>
        <button class="btn-step" id="btnVocalUp" aria-label="Increase vocal volume by 50 percent">+50% Volume</button>
      </div>
    </div>

    <!-- Karaoke Music Volume Slider -->
    <div class="control-group">
      <label for="musicVol">
        <span>Karaoke Music Volume:</span>
        <span id="musicVolVal" aria-live="polite">70%</span>
      </label>
      <input type="range" id="musicVol" min="10" max="100" step="5" value="70" aria-label="Karaoke music volume from 10 to 100 percent">
    </div>

    <!-- 3. Concert Hall Reverb / Echo Slider (0% to 80%) -->
    <div class="control-group">
      <label for="echoRange">
        <span>Concert Hall Echo (Reverb):</span>
        <span id="echoVal" aria-live="polite">25%</span>
      </label>
      <input type="range" id="echoRange" min="0" max="80" step="5" value="25" aria-label="Concert hall echo and reverb from 0 to 80 percent">
    </div>

    <!-- 4. Rhythm Sync / Vocal Offset -->
    <div class="control-group">
      <label>
        <span>Rhythm Sync (Vocal Offset):</span>
        <span id="offsetVal" aria-live="polite">220 ms</span>
      </label>
      <div class="btn-step-row">
        <button class="btn-step" id="btnOffsetDown100" aria-label="Decrease offset by 100 milliseconds">-100</button>
        <button class="btn-step" id="btnOffsetDown10" aria-label="Decrease offset by 10 milliseconds">-10</button>
        <div class="val-display" id="offsetNumDisplay">220 ms</div>
        <button class="btn-step" id="btnOffsetUp10" aria-label="Increase offset by 10 milliseconds">+10</button>
        <button class="btn-step" id="btnOffsetUp100" aria-label="Increase offset by 100 milliseconds">+100</button>
      </div>
    </div>

    <div class="timer" id="timeDisp" aria-label="Recording time">00:00</div>
    <div class="status-text" id="statusText" aria-live="polite">Choose your track file above to begin.</div>

    <!-- Main Action Buttons -->
    <div class="btn-row">
      <button class="btn btn-rec" id="startBtn" disabled aria-label="Start Recording">Start Recording</button>
      <button class="btn btn-stop" id="stopBtn" disabled aria-label="Stop Recording or Playback">Stop</button>
    </div>

    <div class="tip-box">
      Tip: Ghazal Concert Hall Reverb & Anti-Distortion Limiter active.
    </div>

    <!-- Mixing Section -->
    <section class="preview-box" id="mixSection" aria-label="Mixing and Export Controls">
      <button class="btn btn-mix" id="mixBtn" aria-label="Mix Backing Track and Recorded Vocals">Mix Track & Vocals</button>
      
      <div id="readySection" style="display:none; margin-top:12px;">
        <audio id="finalAudioPlayer" controls aria-label="Mixed Song Player"></audio>
        <div class="btn-row" style="margin-top:10px;">
          <button class="btn btn-action" id="downloadBtn" aria-label="Download MP3 Song">Download MP3 Song</button>
          <button class="btn btn-action" id="shareBtn" style="background:#8b5cf6;" aria-label="Share MP3 Audio">Share Audio</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    let sharedAudioCtx = null;
    let micStream = null;
    let mediaRecorder = null;
    let vocalChunks = [];
    
    let isPreviewing = false;
    let selectedFile = null;
    let rawVocalBlob = null;
    let finalMp3Blob = null;

    let timerInterval = null;
    let secondsElapsed = 0;
    let meterAnimId = null;

    let currentPitch = 0;
    let currentVocalVol = 100;
    let currentMusicVol = 70;
    let currentOffset = 220;

    const fileInput = document.getElementById('karaokeFile');
    const karaokeAudioPlayer = document.getElementById('karaokeAudioPlayer');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const mixBtn = document.getElementById('mixBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const shareBtn = document.getElementById('shareBtn');
    const previewScaleBtn = document.getElementById('previewScaleBtn');
    const earphoneToggle = document.getElementById('earphoneToggle');
    const modeStatusText = document.getElementById('modeStatusText');
    
    const timeDisp = document.getElementById('timeDisp');
    const statusText = document.getElementById('statusText');
    const mixSection = document.getElementById('mixSection');
    const readySection = document.getElementById('readySection');
    const finalAudioPlayer = document.getElementById('finalAudioPlayer');
    const meterFill = document.getElementById('meterFill');

    const pitchSemi = document.getElementById('pitchSemi');
    const pitchVal = document.getElementById('pitchVal');
    const echoRange = document.getElementById('echoRange');
    const echoVal = document.getElementById('echoVal');
    const musicVol = document.getElementById('musicVol');
    const musicVolVal = document.getElementById('musicVolVal');
    const vocalVolVal = document.getElementById('vocalVolVal');
    const vocalNumDisplay = document.getElementById('vocalNumDisplay');
    const offsetVal = document.getElementById('offsetVal');
    const offsetNumDisplay = document.getElementById('offsetNumDisplay');

    fileInput.addEventListener('change', function() {
      if (!this.files || this.files.length === 0) return;

      selectedFile = this.files[0];
      const objectUrl = URL.createObjectURL(selectedFile);
      
      karaokeAudioPlayer.src = objectUrl;
      karaokeAudioPlayer.volume = currentMusicVol / 100;
      
      statusText.innerText = "Loaded: " + selectedFile.name.substring(0, 22) + "... Ready to record!";
      startBtn.disabled = false;
      previewScaleBtn.disabled = false;
    });

    pitchSemi.oninput = () => {
      currentPitch = parseInt(pitchSemi.value);
      const text = currentPitch === 0 ? "Original (0 st)" : (currentPitch > 0 ? "+" + currentPitch + " st (High)" : currentPitch + " st (Low)");
      pitchVal.innerText = text;
      karaokeAudioPlayer.playbackRate = Math.pow(2, currentPitch / 12);
    };

    function updateVocalVol(val) {
      currentVocalVol = Math.max(50, Math.min(350, val));
      vocalVolVal.innerText = currentVocalVol + "%";
      vocalNumDisplay.innerText = currentVocalVol + "%";
    }
    document.getElementById('btnVocalDown').onclick = () => updateVocalVol(currentVocalVol - 50);
    document.getElementById('btnVocalUp').onclick = () => updateVocalVol(currentVocalVol + 50);

    musicVol.oninput = () => {
      currentMusicVol = parseInt(musicVol.value);
      musicVolVal.innerText = currentMusicVol + "%";
      karaokeAudioPlayer.volume = currentMusicVol / 100;
    };

    echoRange.oninput = () => {
      echoVal.innerText = echoRange.value + '%';
    };

    function updateOffset(val) {
      currentOffset = Math.max(0, Math.min(10000, val));
      offsetVal.innerText = currentOffset + " ms";
      offsetNumDisplay.innerText = currentOffset + " ms";
    }
    document.getElementById('btnOffsetDown100').onclick = () => updateOffset(currentOffset - 100);
    document.getElementById('btnOffsetDown10').onclick = () => updateOffset(currentOffset - 10);
    document.getElementById('btnOffsetUp10').onclick = () => updateOffset(currentOffset + 10);
    document.getElementById('btnOffsetUp100').onclick = () => updateOffset(currentOffset + 100);

    earphoneToggle.addEventListener('change', () => {
      if (earphoneToggle.checked) {
        modeStatusText.innerText = "Mode: Wired Earphones (Pure Studio)";
        modeStatusText.style.color = "#34d399";
      } else {
        modeStatusText.innerText = "Mode: Mobile Speaker (Anti-Bleed)";
        modeStatusText.style.color = "#cbd5e1";
      }
    });

    function getAudioContext() {
      if (!sharedAudioCtx) {
        sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return sharedAudioCtx;
    }

    function stopScalePreview() {
      karaokeAudioPlayer.pause();
      karaokeAudioPlayer.currentTime = 0;
      isPreviewing = false;
      previewScaleBtn.innerText = "Test Scale (Play Track)";
    }

    previewScaleBtn.addEventListener('click', () => {
      if (isPreviewing) {
        stopScalePreview();
        statusText.innerText = "Scale test stopped.";
        return;
      }

      karaokeAudioPlayer.currentTime = 0;
      karaokeAudioPlayer.play();
      isPreviewing = true;
      previewScaleBtn.innerText = "Stop Scale Test";
      statusText.innerText = "Playing track... Rehearse your vocals.";

      karaokeAudioPlayer.onended = () => stopScalePreview();
    });

    // Recording Engine
    startBtn.addEventListener('click', async () => {
      stopScalePreview();
      vocalChunks = [];
      rawVocalBlob = null;

      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') await ctx.resume();

        const isEarphones = earphoneToggle.checked;
        const micConstraints = {
          audio: isEarphones ? {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
            channelCount: 1
          } : {
            echoCancellation: true,
            noiseSuppression: false,
            autoGainControl: true,
            channelCount: 1
          }
        };

        micStream = await navigator.mediaDevices.getUserMedia(micConstraints);

        const micSource = ctx.createMediaStreamSource(micStream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 128;
        micSource.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        function updateMeter() {
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          let average = sum / dataArray.length;
          let pct = Math.min(100, Math.round((average / 110) * 100));
          meterFill.style.width = pct + '%';
          meterAnimId = requestAnimationFrame(updateMeter);
        }
        updateMeter();

        let mime = '';
        const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
        for (let t of types) {
          if (MediaRecorder.isTypeSupported(t)) { mime = t; break; }
        }

        mediaRecorder = mime ? new MediaRecorder(micStream, { mimeType: mime }) : new MediaRecorder(micStream);

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) vocalChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          cancelAnimationFrame(meterAnimId);
          meterFill.style.width = '0%';

          if (vocalChunks.length === 0) {
            alert("No audio captured! Please check microphone permissions.");
            return;
          }

          rawVocalBlob = new Blob(vocalChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          mixSection.style.display = 'block';
          statusText.innerText = "Vocals captured. Click 'Mix Track & Vocals'.";
          mixBtn.focus();
        };

        karaokeAudioPlayer.currentTime = 0;
        await karaokeAudioPlayer.play();

        karaokeAudioPlayer.onended = () => {
          statusText.innerText = "Track finished. Recording stopped automatically.";
          stopRecordingProcess();
        };

        mediaRecorder.start(100);

        startBtn.disabled = true;
        previewScaleBtn.disabled = true;
        stopBtn.disabled = false;
        stopBtn.focus();

        mixSection.style.display = 'none';
        readySection.style.display = 'none';

        secondsElapsed = 0;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          secondsElapsed++;
          let m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
          let s = String(secondsElapsed % 60).padStart(2, '0');
          timeDisp.innerText = `${m}:${s}`;
        }, 1000);

        statusText.innerText = "Recording in progress... Sing into the mic.";
      } catch (err) {
        alert("Microphone Error: " + err.message);
        statusText.innerText = "Mic Error: " + err.message;
        startBtn.disabled = false;
        previewScaleBtn.disabled = false;
        stopBtn.disabled = true;
      }
    });

    function stopRecordingProcess() {
      karaokeAudioPlayer.pause();
      karaokeAudioPlayer.currentTime = 0;

      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
      }
      clearInterval(timerInterval);
      cancelAnimationFrame(meterAnimId);
      startBtn.disabled = false;
      previewScaleBtn.disabled = false;
      stopBtn.disabled = true;
    }

    stopBtn.addEventListener('click', () => {
      statusText.innerText = "Stopped manually.";
      stopRecordingProcess();
    });

    // Offline Mixing Engine
    mixBtn.addEventListener('click', async () => {
      if (!rawVocalBlob || !selectedFile) {
        alert("Audio data missing.");
        return;
      }

      statusText.innerText = "Applying Ghazal Hall Echo & Master Limiter (~3 seconds)...";
      mixBtn.disabled = true;

      try {
        const ctx = getAudioContext();
        
        const trackArrayBuffer = await selectedFile.arrayBuffer();
        const karaokeBuffer = await ctx.decodeAudioData(trackArrayBuffer);

        const vocalArrayBuffer = await rawVocalBlob.arrayBuffer();
        const vocalAudioBuffer = await ctx.decodeAudioData(vocalArrayBuffer);

        const latencySec = parseFloat(currentOffset) / 1000.0;
        const totalDuration = Math.max(karaokeBuffer.duration, vocalAudioBuffer.duration);
        
        const offlineCtx = new OfflineAudioContext(2, 44100 * totalDuration, 44100);

        // 1. MASTER LIMITER
        const masterLimiter = offlineCtx.createDynamicsCompressor();
        masterLimiter.threshold.value = -1.0;
        masterLimiter.knee.value = 0.0;
        masterLimiter.ratio.value = 20.0;
        masterLimiter.attack.value = 0.001;
        masterLimiter.release.value = 0.15;
        masterLimiter.connect(offlineCtx.destination);

        // 2. Karaoke Track Path
        const musicSource = offlineCtx.createBufferSource();
        musicSource.buffer = karaokeBuffer;
        musicSource.detune.value = currentPitch * 100;
        
        const musicGain = offlineCtx.createGain();
        musicGain.gain.value = currentMusicVol / 100;
        musicSource.connect(musicGain);
        musicGain.connect(masterLimiter);

        // 3. Dedicated Vocal Leveler & Compressor
        const vocalCompressor = offlineCtx.createDynamicsCompressor();
        vocalCompressor.threshold.value = -8.0;
        vocalCompressor.knee.value = 10;
        vocalCompressor.ratio.value = 6;
        vocalCompressor.attack.value = 0.01;
        vocalCompressor.release.value = 0.18;

        const vocalSource = offlineCtx.createBufferSource();
        vocalSource.buffer = vocalAudioBuffer;

        const highPass = offlineCtx.createBiquadFilter();
        highPass.type = "highpass";
        highPass.frequency.value = 90;

        const presenceFilter = offlineCtx.createBiquadFilter();
        presenceFilter.type = "peaking";
        presenceFilter.frequency.value = 4200;
        presenceFilter.Q.value = 0.8;
        presenceFilter.gain.value = 2.5;

        vocalSource.connect(highPass);
        highPass.connect(presenceFilter);
        presenceFilter.connect(vocalCompressor);

        const vocalMasterGain = offlineCtx.createGain();
        vocalMasterGain.gain.value = (parseFloat(currentVocalVol) / 100);

        const dryGain = offlineCtx.createGain();
        dryGain.gain.value = 1.0;
        vocalCompressor.connect(dryGain);
        dryGain.connect(vocalMasterGain);

        // 4. CONCERT HALL REVERB & ECHO ENGINE
        const echoPercent = parseFloat(echoRange.value) / 100;
        if (echoPercent > 0.01) {
          const delayL = offlineCtx.createDelay();
          delayL.delayTime.value = 0.22;

          const delayR = offlineCtx.createDelay();
          delayR.delayTime.value = 0.38;

          const hallToneFilter = offlineCtx.createBiquadFilter();
          hallToneFilter.type = "lowpass";
          hallToneFilter.frequency.value = 3000;

          const hallHighPass = offlineCtx.createBiquadFilter();
          hallHighPass.type = "highpass";
          hallHighPass.frequency.value = 200;

          const reverbGain = offlineCtx.createGain();
          reverbGain.gain.value = echoPercent * 0.75; 

          const feedback = offlineCtx.createGain();
          feedback.gain.value = 0.32;

          vocalCompressor.connect(delayL);
          delayL.connect(hallToneFilter);
          hallToneFilter.connect(hallHighPass);
          hallHighPass.connect(delayR);
          delayR.connect(feedback);
          feedback.connect(delayL);

          hallHighPass.connect(reverbGain);
          delayR.connect(reverbGain);
          reverbGain.connect(vocalMasterGain);
        }

        vocalMasterGain.connect(masterLimiter);

        musicSource.start(0);
        if (vocalAudioBuffer.duration > latencySec) {
          vocalSource.start(0, latencySec);
        } else {
          vocalSource.start(0);
        }

        const renderedBuffer = await offlineCtx.startRendering();

        finalMp3Blob = audioBufferToMp3(renderedBuffer);

        const finalUrl = URL.createObjectURL(finalMp3Blob);
        finalAudioPlayer.src = finalUrl;
        readySection.style.display = 'block';
        mixBtn.disabled = false;
        statusText.innerText = "Concert Hall MP3 Ready! Size: ~2.5 MB. Ready to play or download.";
        finalAudioPlayer.focus();
      } catch (err) {
        alert("Mixing failed: " + err.message);
        statusText.innerText = "Mixing Error: " + err.message;
        mixBtn.disabled = false;
      }
    });

    function audioBufferToMp3(audioBuffer) {
      if (typeof lamejs === 'undefined') {
        alert("MP3 library still initializing. Please wait a second and retry.");
        return null;
      }
      const channels = audioBuffer.numberOfChannels;
      const sampleRate = audioBuffer.sampleRate;
      const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128);
      const mp3Data = [];

      const left = audioBuffer.getChannelData(0);
      const right = channels > 1 ? audioBuffer.getChannelData(1) : left;

      const sampleBlockSize = 1152;
      const leftInt16 = new Int16Array(sampleBlockSize);
      const rightInt16 = new Int16Array(sampleBlockSize);

      for (let i = 0; i < left.length; i += sampleBlockSize) {
        const chunkLen = Math.min(sampleBlockSize, left.length - i);
        
        for (let j = 0; j < chunkLen; j++) {
          let sL = Math.max(-1, Math.min(1, left[i + j]));
          leftInt16[j] = sL < 0 ? sL * 0x8000 : sL * 0x7FFF;

          let sR = Math.max(-1, Math.min(1, right[i + j]));
          rightInt16[j] = sR < 0 ? sR * 0x8000 : sR * 0x7FFF;
        }

        let mp3buf;
        if (channels === 2) {
          mp3buf = mp3encoder.encodeBuffer(leftInt16.subarray(0, chunkLen), rightInt16.subarray(0, chunkLen));
        } else {
          mp3buf = mp3encoder.encodeBuffer(leftInt16.subarray(0, chunkLen));
        }

        if (mp3buf.length > 0) {
          mp3Data.push(mp3buf);
        }
      }

      const mp3buf = mp3encoder.flush();
      if (mp3buf.length > 0) {
        mp3Data.push(mp3buf);
      }

      return new Blob(mp3Data, { type: 'audio/mp3' });
    }

    downloadBtn.addEventListener('click', () => {
      if (!finalMp3Blob) return;
      const url = URL.createObjectURL(finalMp3Blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = `Karaoke_Song_${Date.now()}.mp3`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 200);
    });

    shareBtn.addEventListener('click', async () => {
      if (!finalMp3Blob) return;
      const file = new File([finalMp3Blob], `Karaoke_Song_${Date.now()}.mp3`, { type: 'audio/mp3' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'My Karaoke MP3',
            text: 'Listen to my new karaoke song!'
          });
        } catch (err) {}
      } else {
        alert("Direct share not supported on this browser. Please use the Download button.");
      }
    });
  </script>
</body>
</html>
