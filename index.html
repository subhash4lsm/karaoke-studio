<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Karaoke Master Pro - Stable 200ms Zero-Sync Edition</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.all.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: #0f172a; color: #f8fafc; padding: 14px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .card { background: #1e293b; border-radius: 14px; padding: 18px; width: 100%; max-width: 480px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); margin-bottom: 16px; }
    h1 { font-size: 20px; text-align: center; color: #38bdf8; margin-bottom: 14px; }
    
    .file-input-wrapper { margin-bottom: 12px; }
    .file-label { display: block; font-size: 13.5px; color: #38bdf8; font-weight: bold; margin-bottom: 5px; }
    .file-input-field { width: 100%; padding: 10px 12px; background: #334155; color: #f8fafc; border: 2px solid #38bdf8; border-radius: 8px; font-size: 14px; cursor: pointer; }
    
    .toggle-row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px 14px; border-radius: 8px; margin-bottom: 14px; border: 1px solid #334155; }
    .toggle-label { font-size: 14px; color: #cbd5e1; font-weight: 500; }
    .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-toggle { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .3s; border-radius: 28px; }
    .slider-toggle:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider-toggle { background-color: #10b981; }
    input:checked + .slider-toggle:before { transform: translateX(22px); }

    .control-group { margin-bottom: 12px; background: #0f172a; padding: 11px 12px; border-radius: 8px; border: 1px solid #334155; }
    .control-group label { display: flex; justify-content: space-between; font-size: 13.5px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
    input[type="range"] { width: 100%; height: 24px; accent-color: #38bdf8; cursor: pointer; }
    
    .eq-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 4px; }
    .eq-col { display: flex; flex-direction: column; align-items: center; background: #1e293b; padding: 6px; border-radius: 6px; }
    .eq-col span { font-size: 11.5px; color: #cbd5e1; margin-bottom: 4px; font-weight: bold; }
    .eq-col .eq-val { font-size: 12px; color: #38bdf8; margin-top: 2px; }

    .btn-step-row { display: flex; gap: 8px; align-items: center; }
    .btn-step { background: #334155; color: #f8fafc; border: 1px solid #475569; border-radius: 8px; padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer; flex: 1; text-align: center; }
    .btn-step:active { background: #475569; }
    .val-display { min-width: 85px; text-align: center; font-size: 15px; font-weight: bold; color: #38bdf8; }

    .mic-meter-box { margin-bottom: 12px; background: #0f172a; border-radius: 6px; padding: 8px; border: 1px solid #334155; }
    .meter-bar-bg { width: 100%; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; }
    .meter-bar-fill { height: 100%; width: 0%; background: #10b981; }

    .timer { text-align: center; font-size: 26px; font-weight: bold; color: #f43f5e; margin: 8px 0; font-variant-numeric: tabular-nums; }
    
    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    .btn { flex: 1; padding: 13px; border: none; border-radius: 8px; font-size: 14.5px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
    .btn-rec { background: #e11d48; color: #fff; }
    .btn-stop { background: #64748b; color: #fff; }
    .btn-mix { background: #0284c7; color: #fff; width: 100%; margin-top: 10px; }
    .btn-action { background: #10b981; color: #fff; }
    .btn-preview { background: #8b5cf6; color: #fff; width: 100%; margin-bottom: 12px; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .status-text { text-align: center; font-size: 13.5px; color: #38bdf8; margin-top: 8px; min-height: 22px; line-height: 1.4; font-weight: 500; }
    .preview-box { margin-top: 14px; padding-top: 14px; border-top: 1px dashed #334155; display: none; }
    audio { width: 100%; margin-top: 10px; border-radius: 8px; }
    
    .tip-box { background: #0f172a; padding: 10px 12px; border-radius: 6px; font-size: 12px; color: #94a3b8; margin-top: 12px; border-left: 3px solid #38bdf8; }
  </style>
</head>
<body>

  <main class="card">
    <h1>Studio Karaoke Master Pro</h1>
    
    <!-- Track File Input -->
    <div class="file-input-wrapper">
      <label for="karaokeFile" class="file-label">1. Select Karaoke Track (MP3 / WAV):</label>
      <input type="file" id="karaokeFile" class="file-input-field" accept="audio/*">
    </div>

    <!-- Pre-recorded Vocals Input -->
    <div class="file-input-wrapper">
      <label for="vocalFile" class="file-label" style="color:#34d399;">2. Upload Vocals File (Any MP3/WAV/M4A):</label>
      <input type="file" id="vocalFile" class="file-input-field" accept="audio/*" style="border-color:#10b981;">
    </div>

    <!-- Earphones / Speaker Mode Toggle -->
    <div class="toggle-row">
      <span class="toggle-label" id="modeStatusText">Mode: Mobile Speaker (Anti-Bleed Active)</span>
      <label class="switch">
        <input type="checkbox" id="earphoneToggle">
        <span class="slider-toggle"></span>
      </label>
    </div>

    <!-- Track Scale (Pitch Shift) Slider -->
    <div class="control-group">
      <label for="pitchSemi">
        <span>Track Scale (Pitch Shift):</span>
        <span id="pitchVal">Original (0 st)</span>
      </label>
      <input type="range" id="pitchSemi" min="-6" max="6" step="1" value="0">
    </div>

    <!-- Scale Preview Button -->
    <button class="btn btn-preview" id="previewScaleBtn" disabled>Test Scale (Play Track)</button>

    <!-- Auto-Tune Pitch Correction Slider -->
    <div class="control-group">
      <label for="autoTuneRange">
        <span>Auto-Tune Pitch Correction:</span>
        <span id="autoTuneVal" style="color:#10b981; font-weight:bold;">0% (Off)</span>
      </label>
      <input type="range" id="autoTuneRange" min="0" max="100" step="5" value="0" style="accent-color:#10b981;">
    </div>

    <!-- 3-Band Vocal EQ -->
    <div class="control-group">
      <label>
        <span>3-Band Studio Vocal EQ:</span>
        <span id="eqStatusDisp">Flat (0 dB)</span>
      </label>
      <div class="eq-grid">
        <div class="eq-col">
          <span>Bass</span>
          <input type="range" id="eqBass" min="-10" max="10" step="1" value="0">
          <div class="eq-val" id="bassVal">0 dB</div>
        </div>
        <div class="eq-col">
          <span>Mid</span>
          <input type="range" id="eqMid" min="-10" max="10" step="1" value="0">
          <div class="eq-val" id="midVal">0 dB</div>
        </div>
        <div class="eq-col">
          <span>Treble</span>
          <input type="range" id="eqTreble" min="-10" max="10" step="1" value="0">
          <div class="eq-val" id="trebleVal">0 dB</div>
        </div>
      </div>
    </div>

    <!-- Live Mic Activity Indicator -->
    <div class="mic-meter-box">
      <div class="meter-bar-bg">
        <div class="meter-bar-fill" id="meterFill"></div>
      </div>
    </div>

    <!-- Vocal Volume Controls -->
    <div class="control-group">
      <label>
        <span>Vocal Volume:</span>
        <span id="vocalVolVal">100%</span>
      </label>
      <div class="btn-step-row">
        <button class="btn-step" id="btnVocalDown">-50% Volume</button>
        <div class="val-display" id="vocalNumDisplay">100%</div>
        <button class="btn-step" id="btnVocalUp">+50% Volume</button>
      </div>
    </div>

    <!-- Karaoke Music Volume Slider -->
    <div class="control-group">
      <label for="musicVol">
        <span>Karaoke Music Volume:</span>
        <span id="musicVolVal">50%</span>
      </label>
      <input type="range" id="musicVol" min="0" max="100" step="5" value="50">
    </div>

    <!-- Grand Concert Hall Reverb Slider -->
    <div class="control-group">
      <label for="echoRange">
        <span>Grand Concert Hall Reverb:</span>
        <span id="echoVal">30%</span>
      </label>
      <input type="range" id="echoRange" min="0" max="100" step="5" value="30">
    </div>

    <!-- Rhythm Sync / Vocal Offset -->
    <div class="control-group">
      <label>
        <span>Rhythm Sync (Vocal Delay):</span>
        <span id="offsetVal">0 ms</span>
      </label>
      <div class="btn-step-row">
        <button class="btn-step" id="btnOffsetDown100">-100</button>
        <button class="btn-step" id="btnOffsetDown10">-10</button>
        <div class="val-display" id="offsetNumDisplay">0 ms</div>
        <button class="btn-step" id="btnOffsetUp10">+10</button>
        <button class="btn-step" id="btnOffsetUp100">+100</button>
      </div>
    </div>

    <div class="timer" id="timeDisp">00:00</div>
    <div class="status-text" id="statusText">Select a karaoke track to begin.</div>

    <!-- Main Action Buttons -->
    <div class="btn-row">
      <button class="btn btn-rec" id="startBtn" disabled>Start Recording</button>
      <button class="btn btn-stop" id="stopBtn" disabled>Stop</button>
    </div>

    <div class="tip-box">
      Tip: Zero-Latency Instant Capture active (200ms slice). Both mic and track trigger simultaneously at 0.00s.
    </div>

    <!-- Mixing Section -->
    <section class="preview-box" id="mixSection">
      <button class="btn btn-mix" id="mixBtn">Mix Track & Vocals</button>
      
      <div id="readySection" style="display:none; margin-top:12px;">
        <audio id="finalAudioPlayer" controls></audio>
        <div class="btn-row" style="margin-top:10px;">
          <button class="btn btn-action" id="downloadBtn">Download MP3 Song</button>
          <button class="btn btn-action" id="shareBtn" style="background:#8b5cf6;">Share Audio</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    let sharedAudioCtx = null;
    let micStream = null;
    let mediaRecorder = null;
    let vocalChunks = [];
    
    let liveMusicSource = null;
    let previewSource = null;
    let isPreviewing = false;
    let karaokeBuffer = null;
    let rawVocalBlob = null;
    let finalMp3Blob = null;

    let timerInterval = null;
    let secondsElapsed = 0;
    let meterAnimId = null;

    let currentPitch = 0;
    let currentVocalVol = 100;
    let currentMusicVol = 50;
    let currentOffset = 0;
    let currentAutoTune = 0;

    let currentBass = 0;
    let currentMid = 0;
    let currentTreble = 0;

    const fileInput = document.getElementById('karaokeFile');
    const vocalFileInput = document.getElementById('vocalFile');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const mixBtn = document.getElementById('mixBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const shareBtn = document.getElementById('shareBtn');
    const previewScaleBtn = document.getElementById('previewScaleBtn');
    const earphoneToggle = document.getElementById('earphoneToggle');
    const modeStatusText = document.getElementById('modeStatusText');
    
    const timeDisp = document.getElementById('timeDisp');
    const statusText = document.getElementById('statusText');
    const mixSection = document.getElementById('mixSection');
    const readySection = document.getElementById('readySection');
    const finalAudioPlayer = document.getElementById('finalAudioPlayer');
    const meterFill = document.getElementById('meterFill');

    const pitchSemi = document.getElementById('pitchSemi');
    const pitchVal = document.getElementById('pitchVal');
    const autoTuneRange = document.getElementById('autoTuneRange');
    const autoTuneVal = document.getElementById('autoTuneVal');
    const echoRange = document.getElementById('echoRange');
    const echoVal = document.getElementById('echoVal');
    const musicVol = document.getElementById('musicVol');
    const musicVolVal = document.getElementById('musicVolVal');
    const vocalVolVal = document.getElementById('vocalVolVal');
    const vocalNumDisplay = document.getElementById('vocalNumDisplay');
    const offsetVal = document.getElementById('offsetVal');
    const offsetNumDisplay = document.getElementById('offsetNumDisplay');

    const eqBass = document.getElementById('eqBass');
    const eqMid = document.getElementById('eqMid');
    const eqTreble = document.getElementById('eqTreble');
    const bassVal = document.getElementById('bassVal');
    const midVal = document.getElementById('midVal');
    const trebleVal = document.getElementById('trebleVal');
    const eqStatusDisp = document.getElementById('eqStatusDisp');

    function getAudioContext() {
      if (!sharedAudioCtx) {
        sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return sharedAudioCtx;
    }

    // 1. Karaoke Track Upload & Decode
    fileInput.addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      stopScalePreview();
      statusText.innerText = "Decoding music track...";

      try {
        const arrayBuffer = await file.arrayBuffer();
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') await ctx.resume();
        karaokeBuffer = await ctx.decodeAudioData(arrayBuffer);
        startBtn.disabled = false;
        previewScaleBtn.disabled = false;
        statusText.innerText = "Track ready! Tap 'Start Recording' or rehearse scale.";

        if (rawVocalBlob) {
          mixSection.style.display = 'block';
        }
      } catch (err) {
        statusText.innerText = "Audio load error: " + err.message;
      }
    });

    // 2. Pre-recorded Vocals Upload
    vocalFileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      rawVocalBlob = file;
      statusText.innerText = "Vocals loaded: " + file.name.substring(0, 20) + "... Ready to mix!";
      if (karaokeBuffer) {
        mixSection.style.display = 'block';
        readySection.style.display = 'none';
      }
    });

    // Auto-Tune Slider Handler
    autoTuneRange.oninput = () => {
      currentAutoTune = parseInt(autoTuneRange.value);
      if (currentAutoTune === 0) {
        autoTuneVal.innerText = "0% (Off)";
        autoTuneVal.style.color = "#94a3b8";
      } else if (currentAutoTune <= 45) {
        autoTuneVal.innerText = currentAutoTune + "% (Natural)";
        autoTuneVal.style.color = "#38bdf8";
      } else {
        autoTuneVal.innerText = currentAutoTune + "% (Hard Tune)";
        autoTuneVal.style.color = "#10b981";
      }
    };

    // 3-Band Studio EQ Handlers
    function updateEqDisplays() {
      currentBass = parseInt(eqBass.value);
      currentMid = parseInt(eqMid.value);
      currentTreble = parseInt(eqTreble.value);

      bassVal.innerText = (currentBass > 0 ? "+" : "") + currentBass + " dB";
      midVal.innerText = (currentMid > 0 ? "+" : "") + currentMid + " dB";
      trebleVal.innerText = (currentTreble > 0 ? "+" : "") + currentTreble + " dB";

      if (currentBass === 0 && currentMid === 0 && currentTreble === 0) {
        eqStatusDisp.innerText = "Flat (0 dB)";
      } else {
        eqStatusDisp.innerText = "Custom Studio EQ";
      }
    }
    eqBass.oninput = updateEqDisplays;
    eqMid.oninput = updateEqDisplays;
    eqTreble.oninput = updateEqDisplays;

    pitchSemi.oninput = () => {
      currentPitch = parseInt(pitchSemi.value);
      pitchVal.innerText = currentPitch === 0 ? "Original (0 st)" : (currentPitch > 0 ? "+" + currentPitch + " st (High)" : currentPitch + " st (Low)");
      if (previewSource && isPreviewing) {
        previewSource.detune.value = currentPitch * 100;
      }
    };

    function updateVocalVol(val) {
      currentVocalVol = Math.max(50, Math.min(350, val));
      vocalVolVal.innerText = currentVocalVol + "%";
      vocalNumDisplay.innerText = currentVocalVol + "%";
    }
    document.getElementById('btnVocalDown').onclick = () => updateVocalVol(currentVocalVol - 50);
    document.getElementById('btnVocalUp').onclick = () => updateVocalVol(currentVocalVol + 50);

    musicVol.oninput = () => {
      currentMusicVol = parseInt(musicVol.value);
      musicVolVal.innerText = currentMusicVol + "%";
      if (previewSource && previewSource.gainNode) {
        previewSource.gainNode.gain.value = currentMusicVol / 100;
      }
    };

    echoRange.oninput = () => {
      echoVal.innerText = echoRange.value + '%';
    };

    function updateOffset(val) {
      currentOffset = Math.max(-1000, Math.min(5000, val));
      offsetVal.innerText = currentOffset + " ms";
      offsetNumDisplay.innerText = currentOffset + " ms";
    }
    document.getElementById('btnOffsetDown100').onclick = () => updateOffset(currentOffset - 100);
    document.getElementById('btnOffsetDown10').onclick = () => updateOffset(currentOffset - 10);
    document.getElementById('btnOffsetUp10').onclick = () => updateOffset(currentOffset + 10);
    document.getElementById('btnOffsetUp100').onclick = () => updateOffset(currentOffset + 100);

    earphoneToggle.addEventListener('change', () => {
      if (earphoneToggle.checked) {
        modeStatusText.innerText = "Mode: Wired Earphones (Pure Studio)";
        modeStatusText.style.color = "#34d399";
      } else {
        modeStatusText.innerText = "Mode: Mobile Speaker (Anti-Bleed Active)";
        modeStatusText.style.color = "#cbd5e1";
      }
    });

    function stopScalePreview() {
      if (previewSource) {
        try { previewSource.stop(); } catch(e){}
        previewSource = null;
      }
      isPreviewing = false;
      previewScaleBtn.innerText = "Test Scale (Play Track)";
    }

    previewScaleBtn.addEventListener('click', async () => {
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') await ctx.resume();

      if (isPreviewing) {
        stopScalePreview();
        statusText.innerText = "Scale test stopped.";
        return;
      }

      if (!karaokeBuffer) return;

      previewSource = ctx.createBufferSource();
      previewSource.buffer = karaokeBuffer;
      previewSource.detune.value = currentPitch * 100;

      const previewGain = ctx.createGain();
      previewGain.gain.value = currentMusicVol / 100;
      previewSource.gainNode = previewGain;

      previewSource.connect(previewGain);
      previewGain.connect(ctx.destination);

      previewSource.onended = () => stopScalePreview();

      previewSource.start(0);
      isPreviewing = true;
      previewScaleBtn.innerText = "Stop Test";
      statusText.innerText = "Playing track... Rehearse your vocals.";
    });

    // Zero-Latency Synchronized Microphone Recording Engine (200ms slice)
    startBtn.addEventListener('click', async () => {
      stopScalePreview();
      vocalChunks = [];
      rawVocalBlob = null;

      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') await ctx.resume();

        const isEarphones = earphoneToggle.checked;
        
        // Microphone constraints: Unrestricted clean capture to prevent hardware cutoff on mobile speakers
        const micConstraints = {
          audio: isEarphones ? {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          } : {
            echoCancellation: false, // Prevents aggressive muting while speaker is playing
            noiseSuppression: false,
            autoGainControl: true
          }
        };

        micStream = await navigator.mediaDevices.getUserMedia(micConstraints);

        // Visualizer Meter Setup
        const micSource = ctx.createMediaStreamSource(micStream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 128;
        micSource.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        function updateMeter() {
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          let average = sum / dataArray.length;
          let pct = Math.min(100, Math.round((average / 110) * 100));
          meterFill.style.width = pct + '%';
          meterAnimId = requestAnimationFrame(updateMeter);
        }
        updateMeter();

        // Audio Container Detection
        let mime = '';
        const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/aac'];
        for (let t of types) {
          if (MediaRecorder.isTypeSupported(t)) { mime = t; break; }
        }

        // Direct hardware stream recording (Rock solid stability in WebView)
        mediaRecorder = mime ? new MediaRecorder(micStream, { mimeType: mime }) : new MediaRecorder(micStream);

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) vocalChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          cancelAnimationFrame(meterAnimId);
          meterFill.style.width = '0%';

          if (vocalChunks.length === 0) {
            alert("No vocal audio captured. Please check mic permissions.");
            return;
          }

          rawVocalBlob = new Blob(vocalChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          mixSection.style.display = 'block';
          readySection.style.display = 'none';
          statusText.innerText = "Recording complete! Tap 'Mix Track & Vocals'.";
          mixBtn.focus();
        };

        // Synchronous Music Playback
        liveMusicSource = ctx.createBufferSource();
        liveMusicSource.buffer = karaokeBuffer;
        liveMusicSource.detune.value = currentPitch * 100;

        const liveMusicGain = ctx.createGain();
        liveMusicGain.gain.value = currentMusicVol / 100;

        liveMusicSource.connect(liveMusicGain);
        liveMusicGain.connect(ctx.destination);

        liveMusicSource.onended = () => {
          statusText.innerText = "Track finished. Recording stopped.";
          stopRecordingProcess();
        };

        // Trigger both recorder and music at the exact same instant with a 200ms time slice
        mediaRecorder.start(200);
        liveMusicSource.start(0);

        startBtn.disabled = true;
        previewScaleBtn.disabled = true;
        stopBtn.disabled = false;
        fileInput.disabled = true;
        vocalFileInput.disabled = true;
        mixSection.style.display = 'none';
        readySection.style.display = 'none';

        secondsElapsed = 0;
        timeDisp.innerText = "00:00";
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          secondsElapsed++;
          let m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
          let s = String(secondsElapsed % 60).padStart(2, '0');
          timeDisp.innerText = `${m}:${s}`;
        }, 1000);

        statusText.innerText = "Recording in progress... Sing into the microphone.";
      } catch (err) {
        alert("Microphone Error: " + err.message);
        statusText.innerText = "Unable to access microphone.";
        startBtn.disabled = false;
        previewScaleBtn.disabled = false;
        stopBtn.disabled = true;
      }
    });

    function stopRecordingProcess() {
      if (liveMusicSource) {
        try { liveMusicSource.stop(); } catch(e){}
        liveMusicSource = null;
      }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        try { mediaRecorder.requestData(); } catch(e){}
        mediaRecorder.stop();
      }
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
      }
      clearInterval(timerInterval);
      cancelAnimationFrame(meterAnimId);
      startBtn.disabled = false;
      previewScaleBtn.disabled = false;
      stopBtn.disabled = true;
      fileInput.disabled = false;
      vocalFileInput.disabled = false;
    }

    stopBtn.addEventListener('click', () => {
      statusText.innerText = "Recording stopped.";
      stopRecordingProcess();
    });

    // Auto-Tune Chromatic Pitch Correction Processing
    function applyAutoTune(vocalBuffer, strengthPercent) {
      if (strengthPercent <= 0) return vocalBuffer;

      const sr = vocalBuffer.sampleRate;
      const numChannels = vocalBuffer.numberOfChannels;
      const channelData = [];
      for (let c = 0; c < numChannels; c++) {
        channelData.push(vocalBuffer.getChannelData(c));
      }

      const frameSize = 2048;
      const hopSize = 512;
      const totalSamples = vocalBuffer.length;
      const factor = strengthPercent / 100;
      const A4 = 440;

      function getTargetFreq(detectedFreq) {
        if (detectedFreq < 55 || detectedFreq > 1200) return detectedFreq;
        const midi = Math.round(69 + 12 * Math.log2(detectedFreq / A4));
        const target = A4 * Math.pow(2, (midi - 69) / 12);
        return detectedFreq + (target - detectedFreq) * factor;
      }

      function detectPitch(buffer, start) {
        let maxCorr = 0;
        let bestLag = -1;
        const minLag = Math.floor(sr / 1000);
        const maxLag = Math.floor(sr / 65);

        for (let lag = minLag; lag <= maxLag; lag++) {
          let corr = 0;
          for (let i = 0; i < 512; i++) {
            const s1 = buffer[start + i] || 0;
            const s2 = buffer[start + i + lag] || 0;
            corr += s1 * s2;
          }
          if (corr > maxCorr) {
            maxCorr = corr;
            bestLag = lag;
          }
        }
        return bestLag > 0 ? (sr / bestLag) : 0;
      }

      const primary = channelData[0];
      for (let pos = 0; pos < totalSamples - frameSize; pos += hopSize) {
        const detected = detectPitch(primary, pos);
        if (detected > 65 && detected < 1000) {
          const target = getTargetFreq(detected);
          const ratio = target / detected;
          if (Math.abs(ratio - 1) > 0.005) {
            for (let c = 0; c < numChannels; c++) {
              const ch = channelData[c];
              for (let j = 0; j < hopSize; j++) {
                const idx = pos + j;
                const orig = ch[idx];
                const interpIdx = Math.min(totalSamples - 1, Math.round(pos + j * ratio));
                const shifted = ch[interpIdx];
                ch[idx] = (orig * (1 - factor)) + (shifted * factor);
              }
            }
          }
        }
      }
      return vocalBuffer;
    }

    // Grand Concert Hall Impulse Reverb Generator
    function createGrandHallImpulse(ctx, duration = 2.2, decay = 2.0) {
      const rate = ctx.sampleRate;
      const length = rate * duration;
      const impulse = ctx.createBuffer(2, length, rate);
      const left = impulse.getChannelData(0);
      const right = impulse.getChannelData(1);

      for (let i = 0; i < length; i++) {
        const n = i / length;
        const e = Math.exp(-n * decay);
        left[i] = ((Math.random() * 2) - 1) * e;
        right[i] = ((Math.random() * 2) - 1) * e;
      }
      return impulse;
    }

    // Master Mixing Engine
    mixBtn.addEventListener('click', async () => {
      if (!karaokeBuffer || !rawVocalBlob) {
        alert("Please ensure both backing track and vocals are loaded.");
        return;
      }

      statusText.innerText = "Studio mixing initiated...";
      mixBtn.disabled = true;

      try {
        const actx = getAudioContext();
        if (actx.state === 'suspended') await actx.resume();

        const vocalArrBuf = await rawVocalBlob.arrayBuffer();
        let vocalBuffer = await actx.decodeAudioData(vocalArrBuf);

        if (currentAutoTune > 0) {
          statusText.innerText = `Applying Studio Auto-Tune (${currentAutoTune}%)...`;
          vocalBuffer = applyAutoTune(vocalBuffer, currentAutoTune);
        }

        statusText.innerText = "Rendering Reverb, Studio EQ and Volumes...";

        const sampleRate = 44100;
        const offsetSec = currentOffset / 1000;
        const totalDuration = Math.max(karaokeBuffer.duration, vocalBuffer.duration + Math.abs(offsetSec)) + 1.0;
        const totalLength = Math.ceil(totalDuration * sampleRate);

        const offCtx = new OfflineAudioContext(2, totalLength, sampleRate);

        // Backing Track Setup
        const musicSource = offCtx.createBufferSource();
        musicSource.buffer = karaokeBuffer;
        if (currentPitch !== 0) {
          musicSource.detune.value = currentPitch * 100;
        }

        const musicGain = offCtx.createGain();
        musicGain.gain.value = currentMusicVol / 100;
        musicSource.connect(musicGain);
        musicGain.connect(offCtx.destination);

        // Vocals Setup
        const vocalSource = offCtx.createBufferSource();
        vocalSource.buffer = vocalBuffer;

        const vocalGain = offCtx.createGain();
        vocalGain.gain.value = currentVocalVol / 100;

        // 3-Band Parametric EQ Filters
        const bassFilter = offCtx.createBiquadFilter();
        bassFilter.type = 'lowshelf';
        bassFilter.frequency.value = 250;
        bassFilter.gain.value = currentBass;

        const midFilter = offCtx.createBiquadFilter();
        midFilter.type = 'peaking';
        midFilter.frequency.value = 1500;
        midFilter.Q.value = 1.0;
        midFilter.gain.value = currentMid;

        const trebleFilter = offCtx.createBiquadFilter();
        trebleFilter.type = 'highshelf';
        trebleFilter.frequency.value = 4000;
        trebleFilter.gain.value = currentTreble;

        vocalSource.connect(bassFilter);
        bassFilter.connect(midFilter);
        midFilter.connect(trebleFilter);
        trebleFilter.connect(vocalGain);

        // Concert Hall Reverb Processing
        const echoPercent = parseInt(echoRange.value) / 100;
        if (echoPercent > 0) {
          const convolver = offCtx.createConvolver();
          convolver.buffer = createGrandHallImpulse(offCtx, 2.2, 2.0);

          const wetGain = offCtx.createGain();
          wetGain.gain.value = echoPercent * 0.7;

          const dryGain = offCtx.createGain();
          dryGain.gain.value = 1.0;

          vocalGain.connect(convolver);
          convolver.connect(wetGain);
          wetGain.connect(offCtx.destination);

          vocalGain.connect(dryGain);
          dryGain.connect(offCtx.destination);
        } else {
          vocalGain.connect(offCtx.destination);
        }

        musicSource.start(0);
        if (offsetSec >= 0) {
          vocalSource.start(offsetSec);
        } else {
          vocalSource.start(0, Math.abs(offsetSec));
        }

        const renderedBuffer = await offCtx.startRendering();

        statusText.innerText = "Encoding MP3 (192 kbps)...";
        finalMp3Blob = await encodeMp3Blob(renderedBuffer);

        const mixedAudioUrl = URL.createObjectURL(finalMp3Blob);
        finalAudioPlayer.src = mixedAudioUrl;
        
        readySection.style.display = 'block';
        mixSection.scrollIntoView({ behavior: 'smooth' });
        statusText.innerText = "✓ Song mixed! Play, Download or Share below.";
      } catch (err) {
        alert("Mixing error: " + err.message);
        statusText.innerText = "Mixing failed. Check audio sources.";
      } finally {
        mixBtn.disabled = false;
      }
    });

    // Lamejs MP3 Encoder
    function encodeMp3Blob(audioBuffer) {
      return new Promise((resolve) => {
        const numChannels = 2;
        const sampleRate = audioBuffer.sampleRate;
        const mp3encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, 192);

        const leftChan = audioBuffer.getChannelData(0);
        const rightChan = audioBuffer.numberOfChannels > 1 ? audioBuffer.getChannelData(1) : leftChan;
        const sampleCount = audioBuffer.length;

        const leftInt16 = new Int16Array(sampleCount);
        const rightInt16 = new Int16Array(sampleCount);

        for (let i = 0; i < sampleCount; i++) {
          const l = Math.max(-1, Math.min(1, leftChan[i]));
          const r = Math.max(-1, Math.min(1, rightChan[i]));
          leftInt16[i] = l < 0 ? l * 0x8000 : l * 0x7FFF;
          rightInt16[i] = r < 0 ? r * 0x8000 : r * 0x7FFF;
        }

        const mp3Data = [];
        const chunkSize = 1152;
        for (let i = 0; i < sampleCount; i += chunkSize) {
          const leftChunk = leftInt16.subarray(i, i + chunkSize);
          const rightChunk = rightInt16.subarray(i, i + chunkSize);
          const mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
          if (mp3buf.length > 0) mp3Data.push(mp3buf);
        }

        const endBuf = mp3encoder.flush();
        if (endBuf.length > 0) mp3Data.push(endBuf);

        resolve(new Blob(mp3Data, { type: 'audio/mp3' }));
      });
    }

    // Direct Anchor Download Engine
    downloadBtn.addEventListener('click', () => {
      if (!finalMp3Blob) return;
      const url = URL.createObjectURL(finalMp3Blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = `Karaoke_Song_${Date.now()}.mp3`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        statusText.innerText = "✓ Song downloaded successfully!";
      }, 500);
    });

    // Native Web Share API with Auto-Download Fallback
    shareBtn.addEventListener('click', async () => {
      if (!finalMp3Blob) return;
      const file = new File([finalMp3Blob], `Karaoke_Song_${Date.now()}.mp3`, { type: "audio/mp3" });
      
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            title: "Karaoke Studio Song",
            text: "Listen to my latest recorded karaoke track!",
            files: [file]
          });
        } catch (e) {}
      } else {
        downloadBtn.click();
        alert("Direct file sharing not supported on this device. File downloaded to storage; you can share it via WhatsApp directly.");
      }
    });
  </script>
